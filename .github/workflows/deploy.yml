# Auto-deploy to Cloudflare Pages on every push to main.
#
# WHY THIS EXISTS: the Pages project was created via the Cloudflare CLI, which
# locks it to "Direct Upload" mode - it can never be converted to Cloudflare's
# own Git integration ("You cannot update the `source` object in a Direct
# Upload project"). This workflow provides the same outcome (push to main, the
# site updates) by running the CLI deploy from GitHub's runners instead.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN  - scoped to the Cloudflare account, Pages:Edit
#   CLOUDFLARE_ACCOUNT_ID - the 32-char account id
#
# Optional repository variables - these are public values, not secrets, because
# they are compiled into the client bundle anyway:
#   NEXT_PUBLIC_SITE_NAME, NEXT_PUBLIC_GITHUB_URL, NEXT_PUBLIC_CONTACT_EMAIL

name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
    # Docs-only pushes don't need a build. This keeps README edits from
    # spending the free tier's 500 builds/month.
    paths-ignore:
      - "**/*.md"
      - "**/*.txt"
  workflow_dispatch: # manual trigger from the Actions tab

# Never let two deploys race. Without this, two quick pushes can finish out
# of order and leave the older deployment live.
concurrency:
  group: pages-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          NEXT_PUBLIC_SITE_NAME: ${{ vars.NEXT_PUBLIC_SITE_NAME }}
          NEXT_PUBLIC_GITHUB_URL: ${{ vars.NEXT_PUBLIC_GITHUB_URL }}
          NEXT_PUBLIC_CONTACT_EMAIL: ${{ vars.NEXT_PUBLIC_CONTACT_EMAIL }}
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          # Not needed: the CLI token is scoped to the account and used for
          # both authentication and deployment.
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=portfolio-hub --branch=main --commit-dirty=true